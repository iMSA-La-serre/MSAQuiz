# Mode développement avec hot reload :
#   docker compose -f compose.dev.yml up --build
# Le code est monté depuis l'hôte. Les node_modules restent dans des volumes
# Docker : les modules natifs (better-sqlite3) y sont compilés pour Linux, et
# ceux de l'hôte ne sont jamais utilisés.
name: msaquiz-dev

services:
  msaquiz-dev:
    build:
      context: .
      target: dev
    init: true
    ports:
      - "3000:3000"
    environment:
      # Docker Desktop (Windows/macOS) ne transmet pas au conteneur les
      # notifications de modification des fichiers de l'hôte : Vite et tsx
      # surveillent donc les fichiers par scrutation.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - common_node_modules:/app/packages/common/node_modules
      - web_node_modules:/app/packages/web/node_modules
      - socket_node_modules:/app/packages/socket/node_modules

volumes:
  node_modules:
  common_node_modules:
  web_node_modules:
  socket_node_modules:
