server {
    listen 3000;

    root /app/web;
    index index.html;

    # The page names the scripts of the version in place: browsers ask for it
    # again at each visit (a 304 while it has not changed). Without this
    # header, a browser may keep the previous version for hours after a
    # deployment, as nothing tells it the page expires.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Scripts and styles: a new version gets new names. A name no version has
    # is a 404, not the page, which a browser would fail to run as a script.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /branding/ {
        alias /app/config/branding/;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
